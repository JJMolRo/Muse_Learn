<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music MVP</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: #111;
      border-bottom: 1px solid #222;
    }

    h1 {
      color: #00ff88;
      margin: 0;
    }

    .user-info {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
    }

    button {
      background: #00ff88;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      margin-right: 5px;
      font-weight: bold;
    }

    .secondary {
      background: #444;
      color: white;
    }

    .danger {
      background: #ff4d4d;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    #mensaje {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .mensaje-exito {
      background: #103a22;
      color: #7CFFB2;
    }

    .mensaje-error {
      background: #3a1010;
      color: #ff9b9b;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      z-index: 9999;
    }

    .toast-exito {
      background: #103a22;
      color: #7CFFB2;
    }

    .toast-error {
      background: #3a1010;
      color: #ff9b9b;
    }

    .tabla-usuarios {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .tabla-usuarios th,
    .tabla-usuarios td {
      padding: 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }

    .tabla-usuarios th {
      color: #00ff88;
      background: #111;
    }

    .ejercicio-card {
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      border-left: 4px solid #00ff88;
    }

    .resumen-dashboard {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .resumen-card {
      background: #111;
      padding: 10px;
      border-radius: 10px;
      flex: 1;
      min-width: 150px;
      text-align: center;
    }

    .resumen-card strong {
      color: #00ff88;
      font-size: 20px;
    }

    .input-error {
      border: 2px solid #ff4d4d;
      background: #2a1111;
      color: white;
    }

    .input-ok {
      border: 2px solid #00cc6a;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.70);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }

    .modal-contenido {
      background: #1a1a1a;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      border: 1px solid #333;
    }

    .modal-contenido h3 {
      color: #ff9b9b;
      margin-top: 0;
    }

    .modal-contenido p {
      color: #ddd;
    }

    .modal-botones {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

<header>
  <h1>Music MVP 🎵</h1>

  <div class="user-info">
    <span id="usuarioLogeado"></span>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<main>

  <section class="card" id="loginCard">
    <h2>Login</h2>
    <input id="email" placeholder="Correo">
    <input id="password" type="password" placeholder="Contraseña">
    <button onclick="hacerLogin()">Entrar</button>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>CRUD de usuarios</h2>

    <div id="mensaje" class="hidden"></div>

    <h3 id="tituloFormulario">Crear usuario</h3>

    <input type="hidden" id="usuarioId">
    <input id="nombreUsuario" placeholder="Nombre">
    <input id="emailUsuario" placeholder="Correo">
    <input id="passwordUsuario" type="password" placeholder="Contraseña">

    <button id="btnGuardar" onclick="guardarOActualizarUsuario()">Crear usuario</button>
    <button id="btnCancelarEdicion" class="secondary hidden" onclick="cancelarEdicion()">Cancelar edición</button>
    <button onclick="obtenerUsuarios()">Cargar usuarios</button>

    <div class="resumen-dashboard">
      <div class="resumen-card">
        <span>Total usuarios</span>
        <strong id="totalUsuarios">0</strong>
      </div>
    </div>

    <input id="buscadorUsuarios" placeholder="Buscar..." oninput="filtrarUsuarios()">

    <div id="resultado"></div>
  </section>

  <section class="card">
  <h2>Metrónomo</h2>

  <label>BPM:</label>
  <input type="number" id="bpm" value="80" min="40" max="200">

  <button onclick="iniciarMetronomo()">Iniciar</button>
  <button onclick="detenerMetronomo()">Detener</button>

  <p id="estadoMetronomo">Detenido</p>
</section>

  <section class="card" id="ejerciciosCard">
    <h2>Ejercicios musicales</h2>

    <select id="nivelEjercicio">
      <option value="">Todos los niveles</option>
      <option value="basico">Básico</option>
      <option value="intermedio">Intermedio</option>
      <option value="avanzado">Avanzado</option>
    </select>

    <button onclick="obtenerEjercicios()">Cargar ejercicios</button>

    <div id="listaEjercicios"></div>
  </section>

  <section class="card" id="resultadosCard">
    <h2>Historial de resultados</h2>

    <button onclick="obtenerResultados()">Ver resultados</button>
    <button onclick="cargarNivelRecomendado()">Practicar nivel recomendado</button>

    <div class="resumen-dashboard">
      <div class="resumen-card">
        <span>Total respuestas</span>
        <strong id="totalResultados">0</strong>
      </div>

      <div class="resumen-card">
        <span>Correctas</span>
        <strong id="totalCorrectas">0</strong>
      </div>

      <div class="resumen-card">
        <span>Acierto</span>
        <strong id="porcentajeAcierto">0%</strong>
      </div>

      <div class="resumen-card">
        <span>Nivel recomendado</span>
        <strong id="nivelRecomendado">basico</strong>
      </div>
    </div>

    <div id="listaResultados"></div>
    <div id="progresoUsuario"></div>
  </section>

</main>

<div id="toast" class="toast hidden"></div>

<div id="modalEliminar" class="modal hidden">
  <div class="modal-contenido">
    <h3>Confirmar eliminación</h3>
    <p>¿Seguro que deseas eliminar este usuario?</p>

    <div class="modal-botones">
      <button class="danger" onclick="confirmarEliminar()">Sí, eliminar</button>
      <button class="secondary" onclick="cerrarModalEliminar()">Cancelar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
